<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deployment Tickets Tracker</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --color-primary-base: #4f46e5;
      --color-primary-dark: #2563eb;
    }
    body { font-family: 'Inter', sans-serif; }
    .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
    .Pending-row { background-color: #fffbeb !important; transition: background-color .25s ease; }
    .Retesting-Done-row { background-color: #ecfdf5 !important; transition: background-color .25s ease; }
    #exportBtn, #exportPngBtn { background: linear-gradient(90deg, var(--color-primary-base), var(--color-primary-dark)); color: #fff; border: none; }
    /* Force chart to a medium fixed height and let Chart.js fill it */
    #testerChart { height: 320px !important; max-height: 320px; }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-md py-4 mb-8">
    <div class="container flex justify-between items-center">
      <h1 class="text-3xl font-extrabold text-gray-800 flex items-center">
        <i data-lucide="shield-check" class="w-7 h-7 mr-3 text-green-600"></i>
        Deployment Tickets Tracker
      </h1>
      <nav class="flex items-center space-x-3">
        <a href="index.html"
          class="px-3 py-1.5 text-sm font-semibold text-white bg-[var(--color-primary-base)] rounded-lg hover:bg-[var(--color-primary-dark)] shadow-md flex items-center">
          <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> Back to Dashboard
        </a>

        <button id="exportCsvBtn" class="px-3 py-1.5 text-sm font-semibold rounded-lg shadow-md flex items-center">
          <i data-lucide="download" class="w-4 h-4 mr-1"></i> Export CSV
        </button>

        <button id="exportPngBtn" class="px-3 py-1.5 text-sm font-semibold rounded-lg shadow-md flex items-center">
          <i data-lucide="image" class="w-4 h-4 mr-1"></i> Export PNG
        </button>

        <button id="saveBtn" class="px-3 py-1.5 text-sm font-semibold bg-green-600 text-white rounded-lg hover:bg-green-700 shadow-md flex items-center">
          <i data-lucide="save" class="w-4 h-4 mr-1"></i> Save
        </button>

        <button id="resetBtn" class="px-3 py-1.5 text-sm font-semibold bg-red-600 text-white rounded-lg hover:bg-red-700 shadow-md flex items-center">
          <i data-lucide="trash" class="w-4 h-4 mr-1"></i> Reset
        </button>
      </nav>
    </div>
  </header>

  <main id="mainContent" class="container space-y-8">
    <!-- KPI CARDS -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-4 rounded-xl shadow-lg border-t-4 border-yellow-400">
        <h3 class="text-sm font-semibold text-gray-600">Pending Tickets</h3>
        <p id="pendingCount" class="text-3xl font-bold text-yellow-600">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-lg border-t-4 border-green-500">
        <h3 class="text-sm font-semibold text-gray-600">Retesting Done</h3>
        <p id="doneCount" class="text-3xl font-bold text-green-600">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-lg border-t-4 border-indigo-500">
        <h3 class="text-sm font-semibold text-gray-600">Total Tickets</h3>
        <p id="totalCount" class="text-3xl font-bold text-indigo-600">0</p>
      </div>
    </section>

    <!-- Add Ticket -->
    <section class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-green-600">
      <h2 class="text-xl font-bold mb-4 text-gray-700">Add New Ticket</h2>
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">JIRA Ticket ID</label>
          <input id="jiraTicketId" type="text" placeholder="e.g., JIRA-1234" class="w-full p-2 border rounded-lg">
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Subject / Description</label>
          <input id="jiraSubject" type="text" placeholder="Brief summary" class="w-full p-2 border rounded-lg">
        </div>

        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Assign Tester</label>
          <select id="jiraTesterSelect" class="w-full p-2 border rounded-lg"></select>
        </div>

        <div class="md:col-span-1">
          <button id="addTicketBtn" class="w-full px-4 py-2 bg-green-600 text-white rounded-lg">Add Ticket</button>
        </div>
      </div>
    </section>

    <!-- Ticket Table -->
    <section class="bg-white p-6 rounded-xl shadow-lg">
      <h2 class="text-2xl font-bold mb-4 text-gray-700">Deployment Tickets List</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">JIRA ID</th>
              <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">Subject</th>
              <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">Tester</th>
              <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">Status</th>
              <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">Timestamp</th>
              <th class="px-4 py-2 text-left font-medium text-gray-500 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody id="jiraTicketTableBody" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>
      <p id="noTicketsMessage" class="text-center py-8 text-gray-500 hidden">No tickets found. Add a new ticket above.</p>
    </section>

    <!-- Chart Section (bottom) -->
    <section class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-600">
      <h2 class="text-lg font-bold mb-4 text-gray-700">Tickets by Tester & Status</h2>
      <div style="position:relative; height:320px;">
        <canvas id="testerChart"></canvas>
      </div>
    </section>
  </main>

  <script>
  // --------------------------
  // Constants & helpers
  // --------------------------
  const DEPLOYMENT_KEY = 'testingDataRegressionDeploymentTickets';
  const TESTER_NAMES = ['Unassigned', 'IMRAN', 'JOHN', 'NARESH', 'SALIQ', 'YUSUF', 'Deployment Team'];
  const STATUS_LIST = ['Pending', 'Retesting Done'];

  function pad(n){ return String(n).padStart(2,'0'); }
  function nowFormatted(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }

  // --------------------------
  // State
  // --------------------------
  let tickets = [];
  let testerChartInstance = null;

  // --------------------------
  // Persistence
  // --------------------------
  function loadFromStorage(){
    const raw = localStorage.getItem(DEPLOYMENT_KEY);
    if(raw){
      try { tickets = JSON.parse(raw); }
      catch(e){ tickets = []; }
    } else {
      tickets = [
        { id: 'JIRA-1001', subject: 'Fix DB timeout issue', tester: 'IMRAN', status: 'Pending', timestamp: 'N/A' },
        
      ];
      saveToStorage();
    }
  }
  function saveToStorage(){
    localStorage.setItem(DEPLOYMENT_KEY, JSON.stringify(tickets));
    // flash Save button
    const btn = document.getElementById('saveBtn');
    if(btn){ const orig = btn.innerHTML; btn.innerHTML = 'Saved'; setTimeout(()=> btn.innerHTML = orig, 700); }
  }

  // --------------------------
  // Render helpers
  // --------------------------
  function populateTesterSelect(){
    const sel = document.getElementById('jiraTesterSelect');
    sel.innerHTML = '';
    TESTER_NAMES.forEach(n => {
      const o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o);
    });
  }

  function updateKPIs(){
    document.getElementById('pendingCount').textContent = tickets.filter(t=>t.status==='Pending').length;
    document.getElementById('doneCount').textContent = tickets.filter(t=>t.status==='Retesting Done').length;
    document.getElementById('totalCount').textContent = tickets.length;
  }

  function renderTable(){
    const tbody = document.getElementById('jiraTicketTableBody');
    tbody.innerHTML = '';
    if(tickets.length === 0){
      document.getElementById('noTicketsMessage').classList.remove('hidden');
      updateKPIs();
      renderChart();
      return;
    }
    document.getElementById('noTicketsMessage').classList.add('hidden');

    tickets.forEach(ticket => {
      const tr = document.createElement('tr');
      // apply row class based on status (matches CSS)
      const cls = ticket.status.replace(/\s/g, '-') + '-row';
      tr.className = cls;

      tr.innerHTML = `
        <td class="px-4 py-2 font-semibold">${escapeHtml(ticket.id)}</td>
        <td class="px-4 py-2">${escapeHtml(ticket.subject)}</td>
        <td class="px-4 py-2">
          <select class="border rounded px-2 py-1 text-sm tester-select">
            ${TESTER_NAMES.map(n => `<option value="${n}" ${n===ticket.tester ? 'selected' : ''}>${n}</option>`).join('')}
          </select>
        </td>
        <td class="px-4 py-2">
          <select class="border rounded px-2 py-1 text-sm status-select">
            ${STATUS_LIST.map(s => `<option value="${s}" ${s===ticket.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </td>
        <td class="px-4 py-2 text-xs text-gray-600">${escapeHtml(ticket.timestamp)}</td>
        <td class="px-4 py-2 text-sm text-red-600 cursor-pointer delete-btn">Delete</td>
      `;

      // attach events
      tr.querySelector('.status-select').addEventListener('change', (e) => {
        const newStatus = e.target.value;
        // if changed to Pending -> set N/A, else set now
        if(newStatus === 'Pending') ticket.timestamp = 'N/A';
        else if(ticket.status === 'Pending' && newStatus !== 'Pending') ticket.timestamp = nowFormatted();
        else ticket.timestamp = nowFormatted();
        ticket.status = newStatus;
        saveToStorage();
        renderAll(); // re-render to apply row color reliably
      });

      tr.querySelector('.tester-select').addEventListener('change', (e) => {
        ticket.tester = e.target.value;
        saveToStorage();
        renderAll(); // re-render chart/kpi
      });

      tr.querySelector('.delete-btn').addEventListener('click', () => {
        if(!confirm(`Delete ${ticket.id}?`)) return;
        tickets = tickets.filter(t => t.id !== ticket.id);
        saveToStorage();
        renderAll();
      });

      tbody.appendChild(tr);
    });

    updateKPIs();
    renderChart(); // chart bottom will update
  }

  function renderChart(){
    const labels = TESTER_NAMES.slice();
    const countsPending = labels.map(() => 0);
    const countsDone = labels.map(() => 0);

    tickets.forEach(t => {
      const idx = labels.indexOf(t.tester) >= 0 ? labels.indexOf(t.tester) : labels.indexOf('Unassigned');
      if(t.status === 'Retesting Done') countsDone[idx] += 1;
      else countsPending[idx] += 1;
    });

    const ctx = document.getElementById('testerChart').getContext('2d');
    if(testerChartInstance) testerChartInstance.destroy();

    testerChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Pending', data: countsPending, backgroundColor: 'rgba(250,204,21,0.9)' },
          { label: 'Retesting Done', data: countsDone, backgroundColor: 'rgba(16,185,129,0.9)' }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' } },
        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision:0 } } }
      }
    });
  }

  // small helper
  function escapeHtml(str){ if(str == null) return ''; return String(str).replace(/[&<>"'`=\/]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'})[s]); }

  // --------------------------
  // Actions: Add, Export, Save, Reset
  // --------------------------
  function addNewTicket(){
    const idEl = document.getElementById('jiraTicketId');
    const subjectEl = document.getElementById('jiraSubject');
    const testerEl = document.getElementById('jiraTesterSelect');

    const id = idEl.value.trim().toUpperCase();
    const subject = subjectEl.value.trim();
    const tester = testerEl.value;

    if(!id || !subject) return alert('JIRA Ticket ID and Subject are required.');
    if(tickets.some(t => t.id === id)) return alert(`JIRA Ticket ID ${id} already exists.`);
    const newTicket = { id, subject, tester: tester || 'Unassigned', status: 'Pending', timestamp: 'N/A' };
    tickets.unshift(newTicket);
    saveToStorage();
    idEl.value = '';
    subjectEl.value = '';
    renderAll();
  }

  function exportJiraTicketsToCSV(){
    if(tickets.length === 0) return alert('No tickets to export.');
    const headers = ['JIRA ID','Subject','Tester','Status','Timestamp'];
    const rows = tickets.map(t => [t.id, t.subject, t.tester, t.status, t.timestamp].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
    const csv = [headers.join(',')].concat(rows).join('\n');
    const blob = new Blob([csv], { type:'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `deployment_tickets_${(new Date()).toISOString().slice(0,10)}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  function exportFullPageAsPng(){
    const el = document.querySelector('#mainContent');
    // ensure chart finished rendering
    setTimeout(()=>{
      html2canvas(el, {
        scale: 2,
        useCORS: true,
        windowWidth: document.documentElement.scrollWidth,
        windowHeight: document.documentElement.scrollHeight,
        scrollX: 0,
        scrollY: 0
      }).then(canvas=>{
        canvas.toBlob(blob=>{
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `deployment_tickets_${(new Date()).toISOString().slice(0,10)}.png`; a.click();
          URL.revokeObjectURL(url);
        }, 'image/png');
      }).catch(err => { console.error(err); alert('Export failed: ' + (err && err.message ? err.message : 'unknown')); });
    }, 250);
  }

  function saveDashboard(){
    saveToStorage();
  }

  function clearAllTickets(){
    if(!confirm('Clear all tickets?')) return;
    localStorage.removeItem(DEPLOYMENT_KEY);
    loadFromStorage();
    renderAll();
  }

  // --------------------------
  // Boot
  // --------------------------
  function renderAll(){
    populateTesterSelect();
    renderTable();
    updateKPIs();
    renderChart();
    lucide.createIcons();
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    loadFromStorage();
    // wire buttons
    document.getElementById('addTicketBtn').addEventListener('click', addNewTicket);
    document.getElementById('exportCsvBtn').addEventListener('click', exportJiraTicketsToCSV);
    document.getElementById('exportPngBtn').addEventListener('click', exportFullPageAsPng);
    document.getElementById('saveBtn').addEventListener('click', saveDashboard);
    document.getElementById('resetBtn').addEventListener('click', clearAllTickets);

    renderAll();
  });
  </script>
</body>
</html>
